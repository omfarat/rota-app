<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışısın - Rota</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #faf7f2;
        color: #1c1917;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        font-size: 3rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.375rem;
      }
      p {
        margin: 0 0 1.75rem;
        color: #57534e;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.875rem 1.75rem;
        border-radius: 1rem;
        background: #1c1917;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🧭</div>
      <h1>Bağlantı yok</h1>
      <p>
        Bu sayfayı henüz indirmedin. Daha önce baktığın şehirler ve rotalar
        internetsiz de açılır.
      </p>
      <a href="/">Şehirlere dön</a>
    </main>
  </body>
</html>
